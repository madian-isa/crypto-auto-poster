name: Trade Setup Bot

on:
  workflow_dispatch:
    inputs:
      force:
        description: "র‍্যান্ডম গেট এড়িয়ে জোর করে চালান (টেস্টের জন্য)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: trade-setup-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Random slot gate
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 - <<'PY'
          import os, random
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          rng = random.Random(now.strftime("%Y%m%d%H"))
          n = rng.randint(1, 5)
          slots = rng.sample(range(6), n)
          slot = now.minute // 10
          go = os.environ.get("FORCE") == "true" or slot in slots

          print(f"এই ঘণ্টায় পোস্ট={n}, স্লট={sorted(slots)}, এখন স্লট={slot}, run={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if go else 'false'}\n")
          PY

      - name: Check out repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run trade setup bot
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          TRADE_MAX_POSTS_PER_DAY: ${{ vars.TRADE_MAX_POSTS_PER_DAY || '100' }}

        run: python -m src.main

      - name: Commit and Push updated state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "trade-setup-bot"
          git config user.email "actions@github.com"

          git add trade_bot_state.json backtest_setups.json

          if git diff --staged --quiet; then
            echo "No state or backtest changes to commit."
            exit 0
          fi

          git commit -m "chore: sync bot state with main [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
