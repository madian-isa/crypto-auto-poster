name: Trade Setup Bot

on:
  schedule:
    - cron: "*/20 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-setup-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trade setup bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          TRADE_MAX_POSTS_PER_DAY: ${{ vars.TRADE_MAX_POSTS_PER_DAY || '70' }}

        run: python -m src.main

      - name: Commit updated bot state and backtest data
        run: |
          git config user.name "trade-setup-bot"
          git config user.email "actions@github.com"

          git add trade_bot_state.json
          git add backtest_setups.json

          if git diff --staged --quiet; then
            echo "No state/backtest changes to commit."
            exit 0
          fi

          git commit -m "chore: update trade bot state and backtest data [skip ci]"

          git fetch origin main

          git checkout origin/main -- trade_bot_state.json
          git checkout origin/main -- backtest_setups.json

          git add trade_bot_state.json
          git add backtest_setups.json

          git commit -m "chore: sync bot state with main [skip ci]" || true

          git push origin HEAD:main
