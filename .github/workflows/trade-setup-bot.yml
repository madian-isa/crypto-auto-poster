name: Trade Setup Bot

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trade setup bot (single post)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          TRADE_MAX_POSTS_PER_DAY: ${{ vars.TRADE_MAX_POSTS_PER_DAY || '20' }}
        run: python -m src.main

      - name: Commit updated state file
        run: |
          git config user.name "trade-setup-bot"
          git config user.email "actions@github.com"
          git add trade_bot_state.json
          git diff --staged --quiet || git commit -m "chore: update trade bot state [skip ci]"
          git push
